name: Foundation Smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate update protocol
        shell: pwsh
        run: python scripts/validate_update_protocol.py

      - name: Compile Python
        shell: pwsh
        run: python -m compileall -q src scripts tests

      - name: Unit smoke tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python -m unittest discover -s tests -v

      - name: Runtime preflight
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python -m sayuri_yukishiro.main --preflight --no-update

      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts\\launcher.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
